# The apps of apps/ that keep no state, for a cluster without persistent storage: aks-hello, and not
# boot-log, whose volume such a cluster cannot provide. The stateless clusters (aks-dev-ext-stateless-az1, -az2: external cells) sync this
# directory instead of apps/ (aks-terraform, envs/dev-ext-stateless-az<N>.tfvars: managed_namespaces.example.flux.path).
#
# An app added to apps/ that needs no volume is added here too.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ext-fi-example
resources:
  - ../apps/aks-hello
# Lab cost exception (dev only): aks-hello runs on the cell's system node instead of the ext-fi
# zone's NAP nodes, so the zone needs no node of its own and its NodePools stay at zero. The zone
# placement is proven (isolation tests); drop this patch to go back to it. The pod keeps the zone's
# namespace, Cilium baseline and gateway - only the node changes. `platform/zone-placement: "off"`
# keeps the platform's zone mutation from adding the zone's nodeSelector; the zone validation still
# reports the pod (audit), which is how the exception stays visible.
patches:
  - target:
      kind: Deployment
      name: aks-hello
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/platform~1zone-placement
        value: "off"
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.azure.com/mode: system
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: CriticalAddonsOnly
            operator: Exists
