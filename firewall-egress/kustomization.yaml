# The apps of apps/ for the lab's cell (aks-terraform envs/dev-int-stateless-az3.tfvars:
# managed_namespaces.int-se-example.flux.path): aks-hello in the int-se zone, on the zone's own nodes, whose
# pod subnet tells the hub's firewall whose flow it is.
#
# aks-hello fetches (and refreshes every minute) a weather forecast from the internet (api.open-meteo.com) and asks
# api.ipify.org once at start for the node's public IP (/public-ip). Nothing here opens either:
# the zone leaves its egress to the hub's firewall, which denies it until the application's firewall rule
# exists (azure-landing-zone, firewall-applications/dev-int/int-se-example.yaml) - proposed by the egress
# agent (onek8s/aks-ai-agents) from the denied flows, and merged by a human. Until then the page shows why
# there is no forecast.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: int-se-example
resources:
  - ../apps/aks-hello
  - ../apps/aks-hello-home
# The lab's replica switch (lab/scale: 0 = switched off, 2 = running), the same in every cell.
components:
  - ../lab/scale
images:
  - name: acronek8sdev.azurecr.io/aks-hello
    newTag: 0.6.0
    digest: sha256:bb1696d01a18d224fefde2f6e04af5e369016b823f448d2eeff531fc3e641a42
patches:
  - target:
      kind: Deployment
      name: aks-hello
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: WEATHER_PLACE
          value: Stockholm
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: WEATHER_URL
          value: https://api.open-meteo.com/v1/forecast?latitude=59.33&longitude=18.07&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto&forecast_days=3
  # Lab cost exception (dev only): the dev cells run without the AKS VPA add-on (aks-terraform,
  # vertical_pod_autoscaler_enabled = false), so they have no VerticalPodAutoscaler CRD - aks-hello's VPA is left
  # out. Drop this patch when the add-on is back.
  - target:
      kind: VerticalPodAutoscaler
      name: aks-hello
    patch: |-
      $patch: delete
      apiVersion: autoscaling.k8s.io/v1
      kind: VerticalPodAutoscaler
      metadata:
        name: aks-hello
