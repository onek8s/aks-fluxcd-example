# The app's internal name, hello.<zone domain> (../../apps/aks-hello-home), for its home cell alone: the
# tenant's `flux.home.path` (aks-terraform tenants/catalogue/dev/int-se-example.yaml), a Kustomization
# of the team's Flux configuration only in `flux.home.cell`. Moving the app to another cell is a change
# of that cell: the old cell prunes the route and its external-dns deletes the record, then the new cell
# creates both (design section 3.1).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: int-se-example
resources:
  - ../../apps/aks-hello-home
