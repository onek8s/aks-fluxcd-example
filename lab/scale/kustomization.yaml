# The lab's Git switch for aks-hello's copies (dev only): how many replicas every cell runs. The cell
# directories (firewall-egress/, firewall-egress-int-fi/, stateless/) include this component, so the
# count below is the replicas of aks-hello in every cell at once - the deployment's own `replicas: 2`
# stays as the application's statement and is overridden here only.
#
#   2 - running (the guardrails' minimum in a stateless cell): what Git says the cells run.
#   0 - switched off in Git (no pod, so NAP removes the zones' nodes within minutes). The platform's rollout
#       guardrails allow 0 on purpose (azure-landing-zone, rollout-guardrails: an application switched off).
#
# A pause of the whole lab is aks-terraform's "Lab power" workflow, which leaves Git alone: its stop suspends
# Flux and scales the apps down in the cluster, its start resumes Flux - which puts THIS number back. So keep
# it at 2 for a start to bring the app back; 0 is for a Git-only pause with the clusters running. Flux applies
# main within a minute. Nothing else changes: routes, gateways, namespaces, policies and the Deployment stay.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
replicas:
  - name: aks-hello
    count: 2
