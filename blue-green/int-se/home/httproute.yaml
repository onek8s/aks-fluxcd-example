# hello.<zone domain> in front of both copies, for the home cell alone (`flux.home.path`, see
# ../../../firewall-egress/home); the same rules and weights as ../httproute.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aks-hello-home
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: ${zone}-gateway
      name: ${zone}
  hostnames:
    - hello.${zone_domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            - name: x-version
              value: blue
      backendRefs:
        - name: aks-hello-blue
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            - name: x-version
              value: green
      backendRefs:
        - name: aks-hello-green
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: aks-hello-blue
          port: 80
          weight: 100
        - name: aks-hello-green
          port: 80
          weight: 0
