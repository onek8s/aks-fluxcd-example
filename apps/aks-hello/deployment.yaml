apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-hello
spec:
  # One replica, replaced rather than surged on an update: the prototype cluster is a single small
  # node with no room for a spare pod. Raise it, and drop the strategy, where there are nodes to spare.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  revisionHistoryLimit: 3
  template:
    spec:
      # The image is built in the environment's Azure Container Registry from onek8s/aks-hello
      # (onek8s/aks-terraform, container_registry_builds). The nodes pull it as the cluster's kubelet
      # identity, which has AcrPull there - no pull secret.
      automountServiceAccountToken: false
      # The namespace enforces the restricted Pod Security Standard.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aks-hello
      containers:
        - name: aks-hello
          # A version the registry has built - the <Version> of onek8s/aks-hello's
          # src/AksHello/AksHello.csproj. Bumping it here is what rolls a release out.
          image: acronek8sdev.azurecr.io/aks-hello:0.2.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DOTNET_EnableDiagnostics
              value: "0"
            # The cluster the pod runs in, which the page shows: hello.onek8s.lol is served by every
            # stateless cluster at once. Filled in by the namespace's Flux configuration, which
            # aks-terraform gives the cluster's name as the post-build variable `cluster_name`.
            - name: CLUSTER_NAME
              value: "${cluster_name}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The namespace quota counts requests and limits of both CPU and memory, so a pod that
          # leaves any of them out is refused.
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
