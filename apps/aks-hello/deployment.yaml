apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-hello
spec:
  # The platform's rollout guardrails (design section 3.4, Azure Policy rollout-guardrails): at least
  # two replicas spread over nodes, and a release that adds the new pod before it takes an old one
  # away, so a node loss or a rollout is never an outage.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 3
  template:
    metadata:
      labels:
        # Placement is the application's choice, stated as labels (design R17): aks-hello:0.3.0 is
        # an amd64 image, and it may run on spot. The platform's Azure Policy mutations turn them
        # into the architecture nodeSelector, the spot toleration and a preference for spot nodes,
        # and put the pod on the int-fi zone's nodes (platform/zone selector and toleration) from
        # its namespace; the cluster autoscaler falls back to on-demand when Azure has no spot capacity.
        platform/arch: amd64
        platform/capacity: spot
    spec:
      # The image is built in the environment's Azure Container Registry from onek8s/aks-hello
      # (onek8s/aks-terraform, container_registry_builds). The nodes pull it as the cluster's kubelet
      # identity, which has AcrPull there - no pull secret.
      automountServiceAccountToken: false
      # The namespace enforces the restricted Pod Security Standard.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        # The pod's volumes and supplementary groups, stated: the restricted standard as AKS's policies check
        # it wants both in 1-65535 (MustRunAs).
        fsGroup: 1654
        supplementalGroups: [1654]
        seccompProfile:
          type: RuntimeDefault
        # `ping` in the pod (aks-hello 0.7.0) as the non-root user without CAP_NET_RAW: an ICMP datagram
        # socket, which the kernel allows only for the groups in this range. A safe sysctl, allowed by
        # the restricted standard; it applies to the pod's own network namespace.
        sysctls:
          - name: net.ipv4.ping_group_range
            value: "1654 1654"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aks-hello
      containers:
        - name: aks-hello
          # A version the registry has built - the <Version> of onek8s/aks-hello's
          # src/AksHello/AksHello.csproj - and its digest: the platform admits images from the environment's
          # registry by digest only (azure-landing-zone, k8s-allowed-images). Bumping both here is what rolls a
          # release out (`az acr repository show --name acronek8sdev --image aks-hello:<version> --query digest`).
          image: acronek8sdev.azurecr.io/aks-hello:0.6.0@sha256:bb1696d01a18d224fefde2f6e04af5e369016b823f448d2eeff531fc3e641a42
          ports:
            # HTTP/1.1, for the kubelet's probes below (httpGet speaks HTTP/1.1 until Kubernetes 1.38)
            - name: http
              containerPort: 8080
            # HTTP/2 cleartext only (h2c), what the Service sends the gateway's requests to (aks-hello 0.5.2+)
            - name: h2c
              containerPort: 8081
          env:
            - name: DOTNET_EnableDiagnostics
              value: "0"
            # The cluster the pod runs in, which the page shows: in an external zone hello.<zone domain>
            # is served by every stateless cell at once. Filled in by the namespace's Flux configuration, which
            # aks-terraform gives the cluster's name as the post-build variable `cluster_name`.
            - name: CLUSTER_NAME
              value: "${cluster_name}"
            # The node, which /status reports.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The VPA (verticalpodautoscaler.yaml) changes the requests of the running container in
          # place; neither resource needs a restart for it.
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
          # The namespace quota counts requests and limits of both CPU and memory, so a pod that
          # leaves any of them out is refused.
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          # Readiness: healthy from the end of startup until SIGTERM - the pod leaves the Service
          # while it shuts down. Liveness: the process still answers HTTP, nothing more, so a
          # restart is never caused by something outside the container. Both from aks-hello 0.3.0.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
