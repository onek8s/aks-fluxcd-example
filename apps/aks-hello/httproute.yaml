# Publishes the app on its zone's Gateway - `ext-fi` in `ext-fi-gateway`, served by AKS App Routing
# (class approuting-istio) for the ext-fi isolation zone, which only the zone's application namespaces
# may attach to. The Gateway's one listener is HTTPS for *.${zone_domain} with the zone's wildcard
# certificate, both the platform's (onek8s/aks-fluxcd-platform); the route names its own hostnames
# below the zone's domain, which aks-terraform gives the namespace's Flux configuration as
# ${zone_domain}.
#
# This route is the app's name in this cell, hello-<cluster>.<zone domain>, which the cell's
# external-dns publishes as an A record of the cell's ext-fi gateway. It is also what Azure Traffic
# Manager sends hello.<zone domain> to (aks-global.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aks-hello
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: ext-fi-gateway
      name: ext-fi
  hostnames:
    - hello-${cluster_name}.${zone_domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: aks-hello
          port: 80
---
# hello.<zone domain>, the name every cell serves at once: its record is a CNAME to aks-terraform's
# Azure Traffic Manager profile, which hands out one cell or another and leaves out a cell whose
# probe of /healthz fails. The controller annotation tells the cell's external-dns to leave the name
# alone.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aks-hello-global
  annotations:
    external-dns.kubernetes.io/controller: traffic-manager
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: ext-fi-gateway
      name: ext-fi
  hostnames:
    - hello.${zone_domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: aks-hello
          port: 80
