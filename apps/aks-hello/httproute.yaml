# Publishes the app on its zone's Gateway - `<zone>` in `<zone>-gateway` (`int-fi` in the lab's internal
# cell), served by Traefik or AKS App Routing for the zone, which only the zone's application
# namespaces may attach to. The zone is the post-build variable `zone` of the namespace's Flux
# configuration (aks-terraform, managed_namespaces.<ns>.flux.substitute). The Gateway's one listener is HTTPS for *.${zone_domain} with the zone's wildcard
# certificate, both the platform's (onek8s/aks-fluxcd-platform); the route names its own hostnames
# below the zone's domain, which aks-terraform gives the namespace's Flux configuration as
# ${zone_domain}.
#
# This route is the app's name in this cell, hello-<cluster>.<zone domain>, which the cell's
# external-dns publishes as an A record of the cell's zone gateway - in the zone's private DNS for an
# internal zone, whose external-dns publishes only routes whose platform/home-cell is its cluster. In an
# external cell it is also what Azure Traffic Manager sends hello.<zone domain> to (../aks-hello-global);
# in an internal one, hello.<zone domain> is the home cell's (../aks-hello-home).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aks-hello
  annotations:
    platform/home-cell: "${cluster_name}"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: ${zone}-gateway
      name: ${zone}
  hostnames:
    - hello-${cluster_name}.${zone_domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: aks-hello
          port: 80
