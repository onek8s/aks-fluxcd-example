# Publishes the app through the platform's Gateway, `public`, served by Traefik Proxy - on the
# internet with the cluster's zone public, inside the network with it private (aks-terraform,
# dns_zone_private). The route names no hostname, so it takes the one of each listener it attaches
# to; the listeners, their hostnames and the TLS certificate are the platform's and live in
# onek8s/aks-fluxcd-platform. Plain HTTP is redirected to HTTPS by the platform as well, so only the
# HTTPS listeners are attached to here: `https-example`, the team's hostname on this cluster, and
# `https-example-global`, hello.onek8s.lol.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aks-hello
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: ingress-gateway
      name: public
      sectionName: https-example
    # hello.onek8s.lol, which every stateless cluster serves at once behind aks-terraform's Traffic
    # Manager. A cluster without the listener just leaves this parent unaccepted.
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: ingress-gateway
      name: public
      sectionName: https-example-global
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: aks-hello
          port: 80
