apiVersion: v1
kind: Service
metadata:
  name: aks-hello
spec:
  ports:
    - name: http
      port: 80
      targetPort: h2c
      # HTTP/2 upstream (design section 4.1, D69): the zone gateway connects to the pod over HTTP/2
      # cleartext with prior knowledge (h2c), never HTTP/1.1 - the hop request smuggling needs. The pod's
      # h2c port is its own (8081, HTTP/2 only): Kestrel's default on a port without TLS is HTTP/1.1 alone,
      # which made every route answer 500 with aks-hello 0.5.1. The kubelet's probes keep HTTP/1.1 on 8080
      # until Kubernetes 1.38. The platform's policy requires the field on every routed port.
      appProtocol: kubernetes.io/h2c
