# olljanat-ai/aks-hello, as the platform's Flux reconciles it into the `example` namespace - see
# README.md. The namespace itself, the Gateway this app is published through and its TLS certificate
# belong to the platform (olljanat-ai/aks-fluxcd-platform); everything here is namespaced and lands
# in `example`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: aks-hello
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - poddisruptionbudget.yaml
