# hello.<zone domain> in an internal zone (OneK8s design section 3.1): an internal app runs in one home
# cell, and its name points straight to the zone gateway there - an A record in the zone's private DNS,
# kept by the cell's external-dns. Only the home cell has this route: the tenant's catalogue file names
# the home cell and the path that holds it (aks-terraform tenants/, `flux.home`), which becomes a
# Kustomization of the team's Flux configuration in that cell alone. Moving the app to another cell moves
# the route, and with it the record. An external zone's equivalent is ../aks-hello-global (Traffic
# Manager, every cell at once).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aks-hello-home
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: ${zone}-gateway
      name: ${zone}
  hostnames:
    - hello.${zone_domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: aks-hello
          port: 80
