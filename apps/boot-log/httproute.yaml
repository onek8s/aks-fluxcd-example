# /boot-log/ of the team's hostname in this cluster, on the zone's Gateway like aks-hello's: a longer
# path prefix wins over aks-hello's `/`, so https://hello-<cluster>.<zone domain>/boot-log/log.txt is
# this app's file.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: boot-log
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: ${zone}-gateway
      name: ${zone}
  hostnames:
    - hello-${cluster_name}.${zone_domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /boot-log/
      backendRefs:
        - name: boot-log
          port: 80
